post:
  tags:
    - edit_query
  summary: アクセント句から音素の長さを得る
  operationId: mora_length
  parameters:
    - name: speaker
      in: query
      required: true
      schema:
        type: integer
        title: Speaker
    - name: core_version
      in: query
      required: false
      schema:
        type: string
        title: Core Version
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: ../components/schemas/AccentPhrase.yaml
          title: Accent Phrases
  responses:
    '200':
      description: Successful Response
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/AccentPhrase.yaml
            title: Response Mora Length Mora Length Post
    '422':
      description: Validation Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/HTTPValidationError.yaml
