post:
  tags:
    - synthesis
  summary: 音声合成する（トーク）
  operationId: synthesis_talk
  parameters:
    - name: text
      in: query
      required: true
      schema:
        type: string
        title: Text
    - name: speaker
      in: query
      required: true
      schema:
        type: integer
        title: Speaker
    - name: enable_interrogative_upspeak
      in: query
      required: false
      schema:
        type: boolean
        description: 疑問系のテキストが与えられたら語尾を自動調整する
        default: true
        title: Enable Interrogative Upspeak
      description: 疑問系のテキストが与えられたら語尾を自動調整する
    - name: enable_katakana_english
      in: query
      required: false
      schema:
        type: boolean
        default: true
        title: Enable Katakana English
    - name: core_version
      in: query
      required: false
      schema:
        type: string
        title: Core Version
  responses:
    "200":
      description: Successful Response
      content:
        audio/wav:
          schema:
            type: string
            format: binary
    "400":
      description: Validation Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ValidationError.yaml
