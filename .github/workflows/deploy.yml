name: Terraform Deploy

on:
  push:
    branches: [develop]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Lambda Layer
        run: |
          # フォルダ構造を作成してnpm install
          mkdir -p infra/modules/lambda-node-api/nodejs
          cp backend/package.json infra/modules/lambda-node-api/nodejs/
          cp backend/package-lock.json infra/modules/lambda-node-api/nodejs/

          cd infra/modules/lambda-node-api/nodejs
          npm install --production

          # 正しいZipを作成
          cd ..
          zip -r layer.zip nodejs/

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          # TFCのUser Settings > Tokensで発行したトークンをGitHubのSecretに登録
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        run: terraform init
        working-directory: ./infra/environments/dev

      - name: Terraform Plan
        # plan だけを実行する
        run: terraform plan
        working-directory: ./infra/environments/dev
